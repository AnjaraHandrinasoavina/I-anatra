<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte I-anatra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="inscription.css">
    <link rel="shortcut icon" href="projet.jpg" type="image/x-icon">
</head>
<body>
    <section class="information">
            <div class="back-link">
                <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Retour au site</a>
            </div>
        <img src="projet.jpg" alt="Formation">
        <div class="register-container">
            <h2>Créer un compte</h2>

            <form>
                <div class="input-row">
                    <div class="formulaire">
                        <label for="prenoms">Prénom</label>
                        <input type="text" placeholder="Prénom" id="prenoms">
                    </div>
                    <div class="formulaire">
                        <label for="noms">Nom de famille</label>
                        <input type="text" placeholder="Nom de famille" id="noms">
                    </div>
                </div>

                <div class="formulaire">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" placeholder="exemple@iaho.mg" id="email">
                    </div>
                </div>

                <div class="formulaire">
                    <label for="phone">Numéro de téléphone</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="tel" placeholder="Numéro de téléphone" id="phone">
                    </div>
                </div>

                <div class="input-row">
                    <div class="formulaire">
                        <label for="password">Mot de passe</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" placeholder=". . . . . . . . . . . . ." id="password">
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                    </div>
                    <div class="formulaire">
                        <label for="confirm-password">Confirmer le mot de passe</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" placeholder=". . . . . . . . . . . . ." id="confirm-password">
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">S'inscrire</button>

                <div class="login">
                    Revenir à la connexion <a href="connexion.html">Se connecter</a>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
