<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-anatra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="connexion.css">
    <link rel="shortcut icon" href="projet.jpg" type="image/x-icon">
</head>
<body>
    <section class="information">
        <div class="back-link">
            <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Retour au site</a>
        </div>
    <img src="projet.jpg" alt="Formation">
    <div class="container">
        <div class="formulaire">
            <h2>Bienvenue / Tongasoa / Welcome</h2>
            <p class="welcome-text">Identifiez-vous avec vos informations pour accéder à la plateforme sécurisée</p>

            <form>
                <div class="input-group">
                    <label for="contact">Email ou Téléphone</label>
                    <input type="text" placeholder="Email ou Téléphone" id="contact">
                </div>

                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" placeholder=". . . . . . . . . . . . ." id="password">
                        <i class="fa-regular fa-eye toggle-password" ></i>
                    </div>
                </div>

                <div class="options">
                    <label class="remember-me">
                        <input type="checkbox"> Restez connecté
                    </label>
                    <a href="#" class="forgot-pwd">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="btn-submit">Se connecter</button>
                <div class="inscription">
                    <p>Pas encore de compte ?</p><a href="inscription.html">S'inscrire</a>
                </div>
            </form>
        </div>
    </div>
    </section>
</body>
</html>
